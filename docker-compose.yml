services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: barapp
      POSTGRES_USER: barapp
      POSTGRES_PASSWORD: barapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/barapp
      SPRING_DATASOURCE_USERNAME: barapp
      SPRING_DATASOURCE_PASSWORD: barapp
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
